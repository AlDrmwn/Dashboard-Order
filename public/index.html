<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMIKA - Dashboard & Authentication</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #a8a8a8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #login-section { width: 100%; display: flex; justify-content: center; align-items: center; }
        .login-card {
            background: #ffffff; padding: 40px 30px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 380px; text-align: center;
        }
        .login-card h1 { font-size: 32px; font-weight: bold; color: #2b303a; margin-top: 0; margin-bottom: 25px; }
        .login-card input[type="text"], .login-card input[type="password"] {
            width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #ccc;
            border-radius: 3px; font-size: 14px; outline: none; color: #333;
        }
        .login-card button {
            width: 100%; padding: 10px; background-color: #2b3541; color: #ffffff;
            border: none; border-radius: 3px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 5px; margin-bottom: 15px;
        }
        .login-card button:hover { background-color: #1a222a; }
        .login-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #3b73b9; }
        .login-footer label { color: #555; display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .login-footer a { color: #3b73b9; text-decoration: none; }
        #dashboard-section { display: none; width: 100%; padding: 30px 20px; }
        .container { max-width: 950px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .btn-logout { background-color: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        form { display: grid; gap: 10px; margin-bottom: 30px; background: #f9f9f9; padding: 15px; border-radius: 6px; }
        input, select, textarea { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; padding: 10px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <div id="login-section">
        <div class="login-card">
            <h1>FAMIKA</h1>
            <form id="loginForm" style="background: none; padding: 0; margin: 0; display: block;">
                <input type="text" id="username" placeholder="username" required>
                <input type="password" id="password" placeholder="password" required>
                <button type="submit">Login</button>
            </form>
            <div class="login-footer">
                <label><input type="checkbox" id="terms"> I agree to the <a href="#">Terms of use</a></label>
                <a href="#">Forgot Password?</a>
            </div>
        </div>
    </div>

    <div id="dashboard-section">
        <div class="container">
            <div class="header-bar">
                <div>
                    <h2>Dashboard Order Pemasangan Internet</h2>
                    <p style="margin: 5px 0 0 0; color: #666;">Sistem Manajemen Order & Integrasi API ISP</p>
                </div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
            <h3>Form Tambah Order Baru (Simulasi ISP / Pelanggan)</h3>
            <form id="orderForm">
                <input type="text" id="customer_name" placeholder="Nama Pelanggan" required>
                <input type="text" id="phone" placeholder="No. Telepon / WhatsApp" required>
                <textarea id="address" placeholder="Alamat Lengkap Pemasangan" rows="2" required></textarea>
                <select id="package_name" required>
                    <option value="">-- Pilih Paket Internet --</option>
                    <option value="Paket Fiber 20 Mbps">Paket Fiber 20 Mbps</option>
                    <option value="Paket Fiber 50 Mbps">Paket Fiber 50 Mbps</option>
                    <option value="Paket Fiber 100 Mbps">Paket Fiber 100 Mbps</option>
                </select>
                <button type="submit" class="btn-submit">Kirim Order</button>
            </form>
            <h3>Daftar Pesanan Masuk</h3>
            <table>
                <thead>
                    <tr><th>ID</th><th>Nama</th><th>Telepon</th><th>Alamat</th><th>Paket</th><th>Status</th><th>Waktu</th></tr>
                </thead>
                <tbody id="order-table-body">
                    <tr><td colspan="7" style="text-align: center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('isLoggedIn') === 'true') { showDashboard(); }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const usernameInput = document.getElementById('username').value;
    const passwordInput = document.getElementById('password').value;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const result = await response.json();
        if (result.success) {
            sessionStorage.setItem('isLoggedIn', 'true');
            showDashboard();
        } else {
            alert(result.message || 'Username atau password salah!');
        }
    } catch (err) {
        console.error('Login error:', err);
        alert('Gagal terhubung ke server.');
    }
});
        function showDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            document.body.style.backgroundColor = '#f4f7f6';
            fetchOrders();
        }
        function logout() { sessionStorage.removeItem('isLoggedIn'); location.reload(); }
        async function fetchOrders() {
            try {
                const response = await fetch('/api/orders');
                const result = await response.json();
                const tbody = document.getElementById('order-table-body');
                tbody.innerHTML = '';
                if (!result.data || result.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Belum ada order masuk.</td></tr>';
                    return;
                }
                result.data.forEach(order => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${order.id}</td><td>${order.customer_name}</td><td>${order.phone}</td><td>${order.address}</td><td>${order.package_name}</td><td><b>${order.status || 'Pending'}</b></td><td>${new Date(order.created_at).toLocaleString('id-ID')}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (error) { console.error('Gagal memuat data:', error); }
        }
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                customer_name: document.getElementById('customer_name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                package_name: document.getElementById('package_name').value
            };
            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    alert('Order berhasil dikirim!');
                    document.getElementById('orderForm').reset();
                    fetchOrders();
                } else { alert('Gagal: ' + result.message); }
            } catch (err) { alert('Terjadi kesalahan koneksi.'); }
        });
    </script>
</body>
</html>
